services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: &app-environment
      APP_NAME: Zetwerk
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_KEY: ${APP_KEY:?Set APP_KEY in Coolify}
      APP_URL: ${APP_URL:?Set APP_URL in Coolify}
      APP_LOCALE: nl
      APP_FALLBACK_LOCALE: nl
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_DATABASE: zetwerk
      DB_USERNAME: zetwerk
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Coolify}
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: 'true'
      CACHE_STORE: database
      QUEUE_CONNECTION: database
    command:
      - sh
      - -c
      - php artisan migrate --force --no-interaction && exec apache2-foreground
    expose:
      - '80'
    volumes:
      - app_storage:/var/www/html/storage/app
    depends_on:
      postgres:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: *app-environment
    command: ['php', 'artisan', 'schedule:work', '--no-interaction']
    healthcheck:
      disable: true
    volumes:
      - app_storage:/var/www/html/storage/app
    depends_on:
      app:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zetwerk
      POSTGRES_USER: zetwerk
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Coolify}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zetwerk -d zetwerk']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  app_storage:
  postgres_data:
