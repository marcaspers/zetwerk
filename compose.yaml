services:
  postgres:
    image: postgres:17-alpine
    container_name: zetwerk-postgres
    environment:
      POSTGRES_DB: zetwerk
      POSTGRES_USER: zetwerk
      POSTGRES_PASSWORD: ${DB_PASSWORD:-zetwerk_local_demo}
    ports:
      - '127.0.0.1:5442:5432'
    volumes:
      - zetwerk_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zetwerk -d zetwerk']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  zetwerk_postgres:
    name: zetwerk_postgres
